<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أيقونات SVG — لوحة الإضافة</title>
<style>
  :root {
    --bg:      #17191c;
    --panel:   #2b2e33;
    --line:    #3a3f46;
    --icon:    #cfd4d8;
    --text:    #e6eaed;
    --muted:   #767d85;
    --mark:    #e0392c;
    --ar: "SF Arabic", "Geeza Pro", "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 64px;
    background: var(--bg); color: var(--text);
    font-family: var(--ar); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .bar {
    display: flex; flex-wrap: wrap; gap: 26px; align-items: center;
    padding: 14px 18px; margin: 18px 0 14px;
    border: 1px solid var(--line); border-radius: 10px;
  }
  .ctrl { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .ctrl output { font-family: var(--mono); color: var(--text); min-width: 34px; font-size: 12px; }
  input[type=range] { accent-color: var(--mark); width: 120px; }

  .panel {
    background: var(--panel); border-radius: 12px; padding: 26px 18px 22px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 18px 8px 14px; background: none; border: 1px solid transparent;
    border-radius: 10px; color: var(--icon); cursor: pointer;
    font-family: inherit; transition: background .15s, border-color .15s, color .15s;
  }
  .cell:hover { background: #33373d; color: #fff; }
  .cell:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  .cell.copied { border-color: var(--mark); }
  .ico { width: var(--size, 42px); height: var(--size, 42px); }
  .ar { font-size: 12px; color: #aeb5bc; }
  .slug { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .3px; }

  footer { margin-top: 22px; color: var(--muted); font-size: 12.5px; line-height: 1.9; }
  code { font-family: var(--mono); color: #b9c0c7; font-size: 12px; }

  .toast {
    position: fixed; bottom: 26px; inset-inline-start: 26px;
    background: var(--mark); color: #fff; font-size: 13px;
    padding: 9px 16px; border-radius: 8px;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  .toast.on { opacity: 1; transform: none; }

  @media (max-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

<div class="toast" id="toast">تم نسخ الكود</div>

<script>
  const size = document.getElementById('size');
  const sw   = document.getElementById('sw');
  const toast = document.getElementById('toast');
  let timer;

  function apply() {
    document.documentElement.style.setProperty('--size', size.value + 'px');
    document.getElementById('sizeOut').textContent = size.value;
    document.getElementById('swOut').textContent = Number(sw.value).toFixed(1);
    document.querySelectorAll('.ico').forEach(s => s.setAttribute('stroke-width', sw.value));
  }
  size.addEventListener('input', apply);
  sw.addEventListener('input', apply);
  apply();

  function markup(cell) {
    const svg = cell.querySelector('.ico').cloneNode(true);
    svg.removeAttribute('class');
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    svg.setAttribute('width', size.value);
    svg.setAttribute('height', size.value);
    return svg.outerHTML.replace(/></g, '>\n  <').replace(/\n  <\/svg>/, '\n</svg>');
  }

  document.querySelectorAll('.cell').forEach(cell => {
    cell.addEventListener('click', async () => {
      const code = markup(cell);
      try {
        await navigator.clipboard.writeText(code);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      toast.textContent = 'تم نسخ ' + cell.dataset.key;
      toast.classList.add('on');
      cell.classList.add('copied');
      clearTimeout(timer);
      timer = setTimeout(() => {
        toast.classList.remove('on');
        cell.classList.remove('copied');
      }, 1400);
    });
  });
</script>
